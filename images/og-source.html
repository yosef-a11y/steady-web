<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;600;700&display=swap">
<style>
  html,body{margin:0;width:1200px;height:630px;font-family:"IBM Plex Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  /* Forest ground. No coloured glow: a soft brand-tinted wash under everything
     is the same template tell as a gradient headline. One flat field, one rule. */
  .c{position:relative;width:1200px;height:630px;overflow:hidden;color:#EFF1EE;background:#0C1D15}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(239,241,238,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(239,241,238,.05) 1px,transparent 1px);background-size:62px 62px;-webkit-mask-image:radial-gradient(ellipse 100% 80% at 50% 30%,#000 30%,transparent 78%)}
  .in{position:absolute;inset:0;padding:64px 76px;display:flex;flex-direction:column;justify-content:space-between}
  .logo{display:flex;align-items:center;gap:20px}
  .logo svg{width:76px;height:76px;flex:none}
  .wm{display:flex;flex-direction:column;line-height:1}
  .wm b{font-family:"Source Serif 4",Georgia,serif;font-size:34px;font-weight:700;letter-spacing:-.012em}
  .wm span{font-size:14px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:#EFF1EE;opacity:.72;margin-top:7px}
  h1{margin:0;font-family:"Source Serif 4",Georgia,serif;font-size:82px;line-height:1.05;letter-spacing:-.022em;font-weight:700;max-width:1010px}
  /* Flat, and bone rather than an accent colour: nothing tinted goes on a dark
     ground, because every tint light enough to read there is a pastel. */
  h1 em{font-style:italic;font-weight:600;color:#EFF1EE;opacity:.84}
  .foot{display:flex;justify-content:space-between;align-items:flex-end}
  .tags{display:flex;gap:13px}
  .tag{font-size:18px;font-weight:600;padding:10px 18px;border:1px solid rgba(239,241,238,.26);background:transparent}
  .dom{font-size:23px;font-weight:600;color:rgba(239,241,238,.66)}
</style></head><body><div class="c"><div class="grid"></div><div class="in">
  <div class="logo">
    <svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#1B744A"/><path d="M18 82 H39.33 V60.67 H60.67 V39.33 H82 V18" fill="none" stroke="#EFF1EE" stroke-width="13" stroke-linecap="butt" stroke-linejoin="miter"/></svg>
    <div class="wm"><b>Steady Growth</b><span>Marketing</span></div>
  </div>
  <h1>Your Google Ads should make money.<br><em>We make sure they do.</em></h1>
  <div class="foot">
    <div class="tags"><span class="tag">Google Ads</span><span class="tag">Shopping</span><span class="tag">Meta Ads</span><span class="tag">Lead Generation</span></div>
    <div class="dom">steadygrowthmarketing.com</div>
  </div>
</div></div></body></html>
