<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:1200px;height:630px;font-family:Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .c{position:relative;width:1200px;height:630px;overflow:hidden;color:#fff;background:#0A1638;
     background-image:radial-gradient(760px 480px at 82% 10%,rgba(46,134,224,.42),transparent 62%),radial-gradient(620px 520px at 6% 96%,rgba(22,41,107,.9),transparent 68%)}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:62px 62px;-webkit-mask-image:radial-gradient(ellipse 100% 80% at 50% 30%,#000 30%,transparent 78%)}
  .in{position:absolute;inset:0;padding:64px 76px;display:flex;flex-direction:column;justify-content:space-between}
  .logo{display:flex;align-items:center;gap:18px}
  .logo svg{width:74px;height:auto}
  .wm{display:flex;flex-direction:column;text-transform:uppercase}
  .wm b{font-size:30px;font-weight:800;letter-spacing:.03em;line-height:1.05}
  .wm span{font-size:17px;font-weight:600;letter-spacing:.3em;color:#8FC2F2;margin-top:4px}
  h1{margin:0;font-size:78px;line-height:1.04;letter-spacing:-.03em;font-weight:800;max-width:1000px}
  h1 em{font-style:normal;color:#5B9BD5;background:linear-gradient(100deg,#8FC2F2,#2E86E0);-webkit-background-clip:text;color:transparent}
  .foot{display:flex;justify-content:space-between;align-items:flex-end}
  .tags{display:flex;gap:14px}
  .tag{font-size:19px;font-weight:700;padding:11px 20px;border:1px solid rgba(255,255,255,.22);border-radius:999px;background:rgba(255,255,255,.07)}
  .dom{font-size:24px;font-weight:700;color:rgba(226,236,250,.7);letter-spacing:.01em}
</style></head><body><div class="c"><div class="grid"></div><div class="in">
  <div class="logo">
    <svg viewBox="0 0 104 76" fill="none"><path d="M12 62 L44 24" stroke="#5B9BD5" stroke-width="13" stroke-linecap="round"/><path d="M60 24 L92 62" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round"/><path d="M52 14 L70 40 H60 V64 H44 V40 H34 Z" fill="#2E86E0"/></svg>
    <div class="wm"><b>Steady Growth</b><span>Marketing</span></div>
  </div>
  <h1>Your Google Ads should make money.<br><em>We make sure they do.</em></h1>
  <div class="foot">
    <div class="tags"><span class="tag">Google Ads</span><span class="tag">Shopping</span><span class="tag">Meta Ads</span><span class="tag">Lead Generation</span></div>
    <div class="dom">steadygrowthmarketing.com</div>
  </div>
</div></div></body></html>
